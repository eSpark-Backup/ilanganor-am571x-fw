/* Load the packages */
var socType           = "am571x";
var McASP               = xdc.loadPackage('ti.drv.mcasp');
McASP.Settings.socType  = socType;

var Csl = xdc.useModule('ti.csl.Settings');
Csl.deviceType = "am571x";
/* Load the i2c package */
var I2C               = xdc.loadPackage('ti.drv.i2c');
I2C.Settings.socType  = socType;

/* Load the uart package */
var Uart = xdc.loadPackage('ti.drv.uart');
Uart.Settings.socType  = socType;

/* Load the OSAL package */ 
var osType = "tirtos"
var Osal = xdc.useModule('ti.osal.Settings');
Osal.osType = osType;
Osal.socType = socType;

/* Load the Board package and set the board name */
var Board = xdc.loadPackage('ti.board');
Board.Settings.boardName = "idkAM571x";
/*
var Ipc = xdc.useModule('ti.sdo.ipc.Ipc');
var Resource = xdc.useModule('ti.ipc.remoteproc.Resource');
Resource.customTable = true;*/
/* 
 * The BIOS module will create the default heap for the system.
 * Specify the size of this default heap.
 */
BIOS.heapSize = 65536;

BIOS.cpuFreq.lo = 192000000;

/* System stack size (used by ISRs and Swis) */
Program.stack = 0x1000;

System.SupportProxy = SysStd;

var task0Params = new Task.Params();
task0Params.priority = 7;
task0Params.instance.name = "task0";
task0Params.stackSize = 8192;

Program.global.task0 = Task.create("&Audio_echo_Task", task0Params);

ECM.eventGroupHwiNum[0] = 7;
ECM.eventGroupHwiNum[1] = 8;
ECM.eventGroupHwiNum[2] = 9;
ECM.eventGroupHwiNum[3] = 10;
// chnaging default tick of timer to 100us from default 1000us
var Clock = xdc.useModule('ti.sysbios.knl.Clock'); 
Clock.tickPeriod = 1000;
Clock.timerId=4;


/* 
 * Create and install logger for the whole system
 */
var LoggerBuf = xdc.useModule('xdc.runtime.LoggerBuf');
var loggerBuf0 = LoggerBuf.create();

var Load = xdc.useModule('ti.sysbios.utils.Load');
Load.common$.logger = loggerBuf0;
var Diags = xdc.useModule('xdc.runtime.Diags');
Load.common$.diags_USER4 = Diags.ALWAYS_ON;

Program.sectMap["BOARD_IO_DELAY_DATA"] = "OCMC_RAM1";
Program.sectMap["BOARD_IO_DELAY_CODE"] = "OCMC_RAM1";

var DmTimer = xdc.useModule('ti.sysbios.timers.dmtimer.Timer');
DmTimer.intFreq.lo=20000000;
DmTimer.intFreq.hi=0;
var timerParams= new DmTimer.Params();
timerParams.period=500000;
timerParams.periodType= DmTimer.PeriodType_MICROSECS;
//timerParams.tiocpCfg
DmTimer.create(5, Clock.doTick, timerParams);
DmTimer.checkFrequency = false;
Memory.defaultHeapSize = 65536;
var heapBuf0Params = new HeapBuf.Params();
heapBuf0Params.instance.name = "myHeap";
heapBuf0Params.blockSize = 30000;
heapBuf0Params.numBlocks = 1;
Program.global.myHeap = HeapBuf.create(heapBuf0Params);
BIOS.heapSection = ".host";
var heapMem0Params = new HeapMem.Params();
heapMem0Params.instance.name = "DLYBUFF";
heapMem0Params.size = 0x00200000;
heapMem0Params.sectionName = "DLYBUFF";
Program.global.DLYBUFF = HeapMem.create(heapMem0Params);
